<div class="confirm-overlay">
  <div class="confirm-modal">
    <h2>{{ title() }}</h2>
    @if (message()) {
      <p>{{ message() }}</p>
    }
    <div class="confirm-actions">
      <button type="button" class="button" (click)="cancelled.emit()">{{ cancelLabel() }}</button>
      <button type="button" class="button" [class.button-danger]="danger()" [class.button-primary]="!danger()" (click)="confirmed.emit()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
