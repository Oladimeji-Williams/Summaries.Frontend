<span class="sort-indicator">
  <button type="button" class="sort-toggle" (click)="sortClick.emit()">
    @if (direction() === 'asc') {
      <svg viewBox="0 0 16 16" width="10" height="10" fill="currentColor"><path d="M8 4l4 5H4l4-5z"/></svg>
    } @else if (direction() === 'desc') {
      <svg viewBox="0 0 16 16" width="10" height="10" fill="currentColor"><path d="M8 12L4 7h8l-4 5z"/></svg>
    } @else {
      <svg viewBox="0 0 16 16" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M8 4l4 5H4l4-5z"/>
        <path d="M8 12L4 7h8l-4 5z"/>
      </svg>
    }
  </button>
  @if (showPriority() && priority()) {
    <sup class="sort-priority">{{ priority() }}</sup>
  }
  @if (direction() !== null) {
    <button type="button" class="sort-clear" title="Remove sort" (click)="clearClick.emit()">×</button>
  }
</span>
