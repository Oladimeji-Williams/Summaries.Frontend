<header class="site-header">
  <a routerLink="/books" class="brand">
    <img [src]="logoUrl" alt="Summaries" class="brand-logo" />
    <span class="brand-name">Summaries</span>
  </a>

  <nav class="site-nav">
    <a routerLink="/books" routerLinkActive="active">Books</a>
    @if (auth.isAdmin()) {
      <a routerLink="/admin/users" routerLinkActive="active">Admin</a>
    }
  </nav>

  <app-auth-status />

  <button
    type="button"
    class="theme-toggle"
    [attr.aria-label]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'"
    [attr.title]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'"
    (click)="toggleTheme()"
  >
    @if (isDarkTheme()) {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
      </svg>
    }
  </button>
</header>
