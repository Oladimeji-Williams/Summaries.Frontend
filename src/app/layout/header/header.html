<header class="site-header">
  <a routerLink="/books" class="brand">
    <svg viewBox="0 0 32 32" class="brand-logo" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 6c4-2 9-2 12 0v20c-3-2-8-2-12 0V6Z" fill="currentColor" fill-opacity="0.15"/>
      <path d="M4 6c4-2 9-2 12 0v20c-3-2-8-2-12 0V6Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M28 6c-4-2-9-2-12 0v20c3-2 8-2 12 0V6Z" fill="currentColor" fill-opacity="0.15"/>
      <path d="M28 6c-4-2-9-2-12 0v20c3-2 8-2 12 0V6Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M16 6v20" stroke="currentColor" stroke-width="2"/>
      <path d="M20 12.5l1.4 2.9 3.1.4-2.3 2.2.6 3.1L20 19.6l-2.8 1.5.6-3.1-2.3-2.2 3.1-.4L20 12.5Z" fill="#f2b134"/>
    </svg>
    <span class="brand-name">Summaries</span>
  </a>

  <nav class="site-nav">
    <a routerLink="/books" routerLinkActive="active">Books</a>
    @if (auth.isAdmin()) {
      <a routerLink="/admin/users" routerLinkActive="active">Admin</a>
    }
  </nav>

  <app-auth-status />
</header>
