<header class="site-header">
  <a routerLink="/books" class="brand">
    <img [src]="logoUrl" alt="Summaries" class="brand-logo" />
    <span class="brand-name">Summaries</span>
  </a>

  <nav class="site-nav">
    <a routerLink="/books" routerLinkActive="active">Books</a>
    @if (auth.isAdmin()) {
      <a routerLink="/admin/users" routerLinkActive="active">Admin</a>
    }
  </nav>

  <app-auth-status />
</header>
