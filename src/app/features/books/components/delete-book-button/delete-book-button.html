<button
  type="button"
  class="button button-danger"
  [class.button-small]="small()"
  [disabled]="deleting()"
  (click)="requestDelete()"
>
  @if (deleting()) { Deleting... } @else { Delete }
</button>

@if (showConfirm()) {
  <app-confirm-dialog
    title="Delete this book?"
    message="This action cannot be undone."
    confirmLabel="Delete"
    [danger]="true"
    (confirmed)="confirmDelete()"
    (cancelled)="cancel()"
  />
}
