<div class="cropper-overlay">
  <div class="cropper-modal">
    <h2>Adjust your photo</h2>
    <p>Drag to reposition, use the slider to zoom.</p>

    <div class="cropper-canvas-wrapper">
      <canvas
        #canvas
        (pointerdown)="onPointerDown($event)"
        (pointermove)="onPointerMove($event)"
        (pointerup)="onPointerUp()"
        (pointerleave)="onPointerUp()"
      ></canvas>
    </div>

    <input
      type="range"
      min="0.5"
      max="3"
      step="0.01"
      [value]="zoom()"
      (input)="onZoomChange($any($event.target).value)"
    />

    <div class="cropper-actions">
      <button type="button" class="button" (click)="cancel()">Cancel</button>
      <button type="button" class="button button-primary" (click)="save()">Save</button>
    </div>
  </div>
</div>
